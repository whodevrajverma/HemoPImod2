name: Build HemoPI-MOD2 Apptainer

on: [workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Install Apptainer
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer

      - name: Verify Apptainer
        run: apptainer --version

      - name: Pull Docker image and convert to SIF
        run: |
          apptainer pull hemopimod2.sif docker://drv01/hemopimod2:latest

      - name: Inspect generated SIF
        run: |
          apptainer inspect hemopimod2.sif
          ls -lh hemopimod2.sif

      - name: Upload SIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: HemoPI-MOD2-Apptainer
          path: hemopimod2.sif
          retention-days: 30
